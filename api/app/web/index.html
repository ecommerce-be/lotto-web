<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Lotto</title>
<style>
  :root{
    --sfondo:#f6f5f3; --carta:#fff; --testo:#1a1a19; --tenue:#6b6a66;
    --bordo:#e3e1dc; --accento:#8a5a2b; --verde:#2f6b46; --rosso:#a33a2e;
    --ombra:0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --sfondo:#17171a; --carta:#1f1f23; --testo:#eceae6; --tenue:#9a978f;
      --bordo:#31313a; --accento:#d3a06a; --verde:#7fc79b; --rosso:#e58e80;
      --ombra:none;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--sfondo);color:var(--testo);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:0 16px 64px}
  .contenitore{max-width:880px;margin:0 auto}
  header{padding-block:28px 20px;border-bottom:1px solid var(--bordo);margin-bottom:22px}
  h1{margin:0;font-size:1.45rem;letter-spacing:-.02em;font-weight:640}
  .stato{color:var(--tenue);font-size:.86rem;margin-top:6px}
  .stato .vecchio{color:#c2410c;font-weight:600}
  .aggiornamento{display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    color:var(--tenue);font-size:.82rem;margin-top:10px}
  .aggiornamento button{font:inherit;font-weight:600;color:var(--accento);
    background:none;border:1px solid var(--bordo);border-radius:999px;
    padding:4px 12px;cursor:pointer}
  .aggiornamento button:hover:not(:disabled){border-color:var(--accento)}
  .aggiornamento button:disabled{opacity:.5;cursor:default}
  .schede{display:flex;gap:4px;margin:18px 0 22px;flex-wrap:wrap}
  .schede button{border:1px solid var(--bordo);background:var(--carta);color:var(--tenue);
    padding:7px 15px;border-radius:99px;cursor:pointer;font:inherit;font-size:.88rem}
  .schede button[aria-selected="true"]{background:var(--accento);border-color:var(--accento);color:#fff}
  .carta{background:var(--carta);border:1px solid var(--bordo);border-radius:12px;
    padding:16px 18px;margin-bottom:12px;box-shadow:var(--ombra)}
  .riga{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .metodo{font-weight:620;letter-spacing:-.01em}
  .meta{color:var(--tenue);font-size:.83rem}
  .colpi{font-variant-numeric:tabular-nums;font-size:.83rem;color:var(--tenue);white-space:nowrap}
  .colpi b{color:var(--accento);font-size:1.05rem}
  .sorte{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:9px 0;border-top:1px dashed var(--bordo)}
  .sorte:first-of-type{margin-top:12px}
  .tipo{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tenue);
    min-width:72px}
  .n{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 6px;
    border-radius:50%;background:var(--sfondo);border:1px solid var(--bordo);
    font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem}
  .avviso{margin-top:10px;font-size:.82rem;color:var(--accento)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--bordo);font-size:.88rem}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--tenue);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
  tfoot td{font-weight:650;border-bottom:none}
  .pos{color:var(--verde)} .neg{color:var(--rosso)}
  .scarso{color:var(--tenue);font-size:.74rem;display:block;font-weight:400;
    letter-spacing:0;text-transform:none}
  .avvertenza{margin-top:18px;padding:14px 16px;border-left:3px solid var(--accento);
    background:var(--carta);border-radius:0 8px 8px 0;font-size:.86rem;color:var(--tenue)}
  .vuoto{color:var(--tenue);padding:28px 0;text-align:center}
  /* --- scheda Schedina --- */
  .prossima{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .prossima .quando{font-size:1.1rem;font-weight:640;letter-spacing:-.01em}
  .prossima .fra{color:var(--accento)}
  .prossima .poi{color:var(--tenue);font-size:.82rem}
  .campo{padding:15px 0;border-top:1px dashed var(--bordo)}
  .campo:first-child{border-top:none;padding-top:0}
  .campo .etichetta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--tenue);
    margin-bottom:10px}
  .campo .etichetta .conta{text-transform:none;letter-spacing:0;font-size:.8rem}
  .griglia{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
  @media (max-width:520px){.griglia{grid-template-columns:repeat(6,1fr)}}
  .griglia button{aspect-ratio:1;border:1px solid var(--bordo);background:var(--carta);
    color:var(--testo);border-radius:8px;font:inherit;font-size:.82rem;font-weight:600;
    font-variant-numeric:tabular-nums;cursor:pointer;padding:0}
  .griglia button[aria-pressed="true"]{background:var(--accento);border-color:var(--accento);color:#fff}
  .pillole{display:flex;flex-wrap:wrap;gap:6px}
  .pillole button{border:1px solid var(--bordo);background:var(--carta);color:var(--tenue);
    border-radius:99px;padding:5px 13px;font:inherit;font-size:.84rem;cursor:pointer}
  .pillole button[aria-pressed="true"]{background:var(--accento);border-color:var(--accento);color:#fff}
  .pillole button:disabled{opacity:.35;cursor:default}
  .importo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .importo input{width:120px;font:inherit;font-size:1.05rem;font-weight:640;padding:7px 10px;
    border:1px solid var(--bordo);border-radius:8px;background:var(--sfondo);color:var(--testo);
    font-variant-numeric:tabular-nums}
  select.da-previsione{font:inherit;font-size:.86rem;padding:6px 10px;max-width:100%;
    border:1px solid var(--bordo);border-radius:8px;background:var(--sfondo);color:var(--testo)}
  .ripartizione{color:var(--tenue);font-size:.84rem;margin:0 0 14px}
  .errore{color:var(--rosso);font-size:.88rem;margin:0}
  .verdetto{display:flex;gap:20px;flex-wrap:wrap;margin-top:16px;
    padding-top:14px;border-top:1px dashed var(--bordo)}
  .verdetto > div{flex:1 1 190px}
  .verdetto .valore{font-size:1.2rem;font-weight:660;letter-spacing:-.02em;display:block}
  .verdetto .didascalia{color:var(--tenue);font-size:.78rem}
  .tabella-scroll{overflow-x:auto}
  /* sotto i 640px una tabella a sei colonne diventa illeggibile: ogni riga
     si trasforma in una scheda, con l'etichetta accanto al valore */
  @media (max-width:640px){
    .tabella-scroll{overflow-x:visible}
    table,tbody,tfoot,tr,td{display:block;width:100%}
    thead{display:none}
    tbody tr,tfoot tr{border:1px solid var(--bordo);border-radius:10px;
      padding:10px 12px;margin-bottom:10px}
    td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
      border:none;padding:4px 0;text-align:right}
    td:first-child{display:block;text-align:left;font-weight:620;
      padding-bottom:8px;margin-bottom:6px;border-bottom:1px dashed var(--bordo)}
    td[data-et]::before{content:attr(data-et);color:var(--tenue);font-size:.78rem;
      text-transform:uppercase;letter-spacing:.05em;font-weight:500}
  }
  a{color:var(--accento)}
</style>
</head>
<body>
<div class="contenitore">
  <header>
    <h1>App Lotto</h1>
    <div class="stato" id="stato">caricamento…</div>
    <div class="aggiornamento" id="aggiornamento" hidden>
      <span id="aggiornamento-testo"></span>
      <button id="aggiorna-ora" type="button">Aggiorna ora</button>
    </div>
  </header>

  <div class="schede" role="tablist">
    <button role="tab" data-vista="corso" aria-selected="true">In corso</button>
    <button role="tab" data-vista="bilancio" aria-selected="false">Bilancio</button>
    <button role="tab" data-vista="schedina" aria-selected="false">Schedina</button>
  </div>

  <div id="corso"></div>
  <div id="bilancio" hidden></div>

  <div id="schedina" hidden>
    <article class="carta prossima" id="prossima">
      <div class="quando">caricamento…</div>
    </article>

    <article class="carta">
      <div class="campo">
        <div class="etichetta">
          <span>Numeri</span>
          <span class="conta" id="conta-numeri">nessuno scelto</span>
        </div>
        <select class="da-previsione" id="da-previsione">
          <option value="">parti da una previsione in corso…</option>
        </select>
        <div class="griglia" id="griglia" style="margin-top:12px"></div>
      </div>

      <div class="campo">
        <div class="etichetta"><span>Ruote</span></div>
        <div class="pillole" id="ruote"></div>
      </div>

      <div class="campo">
        <div class="etichetta">
          <span>Sorti</span>
          <span class="conta" id="nota-sorti"></span>
        </div>
        <div class="pillole" id="sorti"></div>
      </div>

      <div class="campo">
        <div class="etichetta"><span>Quanto punti in tutto</span></div>
        <div class="importo">
          <input type="number" id="importo" value="5" min="0.5" step="0.5" inputmode="decimal">
          <span style="color:var(--tenue)">euro</span>
        </div>
      </div>
    </article>

    <div id="risultato"></div>
  </div>
</div>

<script>
const euro = n => n.toLocaleString('it-IT', {style:'currency', currency:'EUR', maximumFractionDigits:0});
const dataIt = s => new Date(s + 'T00:00:00').toLocaleDateString('it-IT',
                     {day:'numeric', month:'long', year:'numeric'});
const NOMI = {
  lottofacile1:'Lotto Facile — Il Metodo Vincente',
  lottofacile4:'Lotto Facile 4 — Ciclo-Pondometria',
  lottofacile5:'Lotto Facile 5 — Rita Calone',
  fulmine:'Fulmine — Osvaldo Manara',
  unsoloambosecco:'Un Solo Ambo Secco',
  ambosecco_caotico:'Ambo Secco Caotico — Antonio Longo',
};

async function prendi(percorso){
  const r = await fetch(percorso);
  if(!r.ok) throw new Error(`${percorso} → ${r.status}`);
  return r.json();
}

const oraIt = s => new Date(s).toLocaleString('it-IT',
                     {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});

function mostraStato(s){
  // Quanti giorni ha l'ultima estrazione in archivio. Il Lotto si tiene cinque
  // volte a settimana: oltre i quattro giorni non e' una pausa, e' un archivio
  // fermo - e previsioni calcolate su un archivio fermo non sono previsioni.
  const giorni = Math.floor((Date.now() - new Date(s.ultima_estrazione + 'T00:00:00')) / 864e5);
  const vecchio = giorni > 4;
  document.getElementById('stato').innerHTML =
    `${s.estrazioni.toLocaleString('it-IT')} estrazioni in archivio · ` +
    `ultima del ${dataIt(s.ultima_estrazione)}` +
    (vecchio ? ` <span class="vecchio">(${giorni} giorni fa: archivio arretrato)</span>` : '') +
    ` · ${s.previsioni.toLocaleString('it-IT')} previsioni`;
}

function mostraAggiornamento(a){
  const box = document.getElementById('aggiornamento');
  const testo = document.getElementById('aggiornamento-testo');
  const bottone = document.getElementById('aggiorna-ora');
  box.hidden = false;
  bottone.disabled = a.in_corso;

  if(a.in_corso){ testo.textContent = 'Aggiornamento in corso…'; return; }

  const parti = [];
  const e = a.ultimo_esito;
  if(e && a.ultimo_avvio){
    parti.push(e.ok
      ? `Ultimo aggiornamento ${oraIt(a.ultimo_avvio)}: ${e.concorsi_scaricati} concorsi, ` +
        `${e.previsioni_generate} previsioni`
      : `Ultimo aggiornamento ${oraIt(a.ultimo_avvio)}: fallito (${e.motivo})`);
  }else{
    parti.push('Nessun aggiornamento ancora eseguito in questa sessione');
  }
  parti.push(a.attivo
    ? `prossimo alle ${a.ora}`
    : `automatico non attivo${a.motivo_inattivo ? ' — ' + a.motivo_inattivo : ''}`);
  testo.textContent = parti.join(' · ');
}

async function aggiornaOra(){
  const bottone = document.getElementById('aggiorna-ora');
  bottone.disabled = true;
  document.getElementById('aggiornamento-testo').textContent = 'Aggiornamento in corso…';
  try{
    const r = await fetch('/servizio/aggiornamento/esegui', {method:'POST'});
    if(!r.ok && r.status !== 409) throw new Error(`errore ${r.status}`);
  }catch(err){
    document.getElementById('aggiornamento-testo').textContent =
      'Non sono riuscito ad avviare l\'aggiornamento: ' + err.message;
    bottone.disabled = false;
    return;
  }
  // il ciclo gira in un thread: si aspetta che il lucchetto si liberi, poi si
  // ricaricano i dati, perche' nel frattempo previsioni ed esiti sono cambiati
  const attendi = setInterval(async () => {
    try{
      const a = await prendi('/servizio/aggiornamento');
      if(a.in_corso) return;
      clearInterval(attendi);
      mostraAggiornamento(a);
      await carica();
    }catch(err){
      // se l'attesa fallisce si smette di aspettare: un intervallo che gira a
      // vuoto lascerebbe il pulsante spento per sempre, senza dire niente
      clearInterval(attendi);
      document.getElementById('aggiornamento-testo').textContent =
        'Aggiornamento avviato, ma non riesco a seguirne l\'esito: ' + err.message;
      bottone.disabled = false;
    }
  }, 2000);
}

function mostraInCorso(lista){
  const c = document.getElementById('corso');
  if(!lista.length){
    c.innerHTML = `<p class="vuoto">Nessuna previsione in corso.<br>
      Genera i rilevamenti con <code>carica_archivio.py --rileva-da</code>.</p>`;
    return;
  }
  c.innerHTML = lista.map(p => `
    <article class="carta">
      <div class="riga">
        <div>
          <div class="metodo">${NOMI[p.metodo] ?? p.metodo}</div>
          <div class="meta">${dataIt(p.data_rilevamento)} · ${p.ruote.join(' · ')}${
            p.anche_tutte ? ' · anche a Tutte' : ''}${p.nota ? ' · ' + p.nota : ''}</div>
        </div>
        <div class="colpi"><b>${p.colpi_residui}</b> colpi su ${p.colpi}</div>
      </div>
      ${p.sorti.map(s => `
        <div class="sorte">
          <span class="tipo">${s.tipo}</span>
          ${s.numeri.map(n => `<span class="n">${n}</span>`).join('')}
        </div>`).join('')}
      ${p.avviso ? `<div class="avviso">${p.avviso}</div>` : ''}
    </article>`).join('');
}

function mostraBilancio(b){
  const segno = v => v >= 0 ? 'pos' : 'neg';
  const righe = b.per_metodo.map(r => `
    <tr>
      <td>${NOMI[r.metodo] ?? r.metodo}
        ${r.campione_scarso ? '<span class="scarso">campione troppo piccolo per essere indicativo</span>' : ''}</td>
      <td data-et="Previsioni">${r.previsioni.toLocaleString('it-IT')}</td>
      <td data-et="Speso">${euro(r.speso)}</td>
      <td data-et="Incassato">${euro(r.incassato)}</td>
      <td data-et="Saldo" class="${segno(r.saldo)}">${euro(r.saldo)}</td>
      <td data-et="Ritorno" class="${r.ritorno >= 1 ? 'pos' : 'neg'}">${(r.ritorno*100).toFixed(1)}%</td>
    </tr>`).join('');
  const t = b.totale;
  document.getElementById('bilancio').innerHTML = `
    <div class="carta tabella-scroll">
      <table>
        <thead><tr><th>Metodo</th><th>Previsioni</th><th>Speso</th>
          <th>Incassato</th><th>Saldo</th><th>Ritorno</th></tr></thead>
        <tbody>${righe}</tbody>
        <tfoot><tr>
          <td>Totale</td>
          <td data-et="Previsioni">${t.previsioni.toLocaleString('it-IT')}</td>
          <td data-et="Speso">${euro(t.speso)}</td>
          <td data-et="Incassato">${euro(t.incassato)}</td>
          <td data-et="Saldo" class="${segno(t.saldo)}">${euro(t.saldo)}</td>
          <td data-et="Ritorno" class="${t.ritorno >= 1 ? 'pos' : 'neg'}">${(t.ritorno*100).toFixed(1)}%</td>
        </tr></tfoot>
      </table>
    </div>
    <p class="avvertenza">${b.avvertenza}<br><br>${b.nota}</p>`;
}

/* ------------------------------------------------------------- schedina
   La simulazione vera sta sul server (app/services/schedina.py): qui si
   raccoglie la giocata e si disegna la risposta. Le quote e la ritenuta non
   compaiono in questa pagina di proposito - se fossero scritte anche qui,
   prima o poi una delle due copie resterebbe indietro. */
const RUOTE = {BA:'Bari', CA:'Cagliari', FI:'Firenze', GE:'Genova', MI:'Milano',
               NA:'Napoli', PA:'Palermo', RM:'Roma', TO:'Torino', VE:'Venezia'};
const SORTI = [['estratto',1], ['ambo',2], ['terno',3], ['quaterna',4], ['cinquina',5]];
const MAX_NUMERI = 10;

const giocata = {numeri: new Set(), ruote: new Set(['NA']), sorti: new Set(['ambo']), importo: 5};
let suggerite = [];
let attesaSimula = null;

// una probabilita' come "1 su X". Sotto il migliaio il decimale conta: l'ambo
// secco e' 1 su 400,5, e arrotondarlo a 400 e' un errore di mezzo punto su 400
const unaSu = p => p ? `1 su ${(1/p).toLocaleString('it-IT',
                        {maximumFractionDigits: 1/p < 1000 ? 1 : 0})}` : '—';
// gli importi piccoli sono poste ripartite: senza decimali 2,50 diventa "3 €"
const euroS = n => n.toLocaleString('it-IT', {style:'currency', currency:'EUR',
  minimumFractionDigits: Math.abs(n) < 100 ? 2 : 0,
  maximumFractionDigits: Math.abs(n) < 100 ? 2 : 0});
const perc = p => p >= 0.01 ? ` (${(p*100).toLocaleString('it-IT',
                    {maximumFractionDigits:1})}%)` : '';

function giorniDa(iso){
  const g = new Date(iso + 'T00:00:00'), oggi = new Date();
  oggi.setHours(0,0,0,0);
  return Math.round((g - oggi) / 864e5);
}

function mostraProssima(p){
  const box = document.getElementById('prossima');
  if(!p.date || !p.date.length){
    box.innerHTML = `<div class="quando">Non riesco a leggere il calendario delle estrazioni.</div>`;
    return;
  }
  const [prima, ...poi] = p.date;
  const g = giorniDa(prima);
  const fra = g <= 0 ? 'stasera' : g === 1 ? 'domani' : `fra ${g} giorni`;
  const giorno = new Date(prima + 'T00:00:00').toLocaleDateString('it-IT',
                   {weekday:'long', day:'numeric', month:'long'});
  box.innerHTML = `
    <div>
      <div class="quando">Prossima estrazione <span class="fra">${fra}</span></div>
      <div class="meta">${giorno} alle ${p.ora}${
        p.stimato ? ' · data stimata, il calendario ufficiale non risponde' : ''}</div>
    </div>
    ${poi.length ? `<div class="poi">poi ${poi.map(d =>
        new Date(d + 'T00:00:00').toLocaleDateString('it-IT',
          {weekday:'short', day:'numeric', month:'short'})).join(' · ')}</div>` : ''}`;
}

function costruisciSchedina(){
  const griglia = document.getElementById('griglia');
  griglia.innerHTML = Array.from({length:90}, (_, i) =>
    `<button type="button" data-n="${i+1}" aria-pressed="false">${i+1}</button>`).join('');
  griglia.onclick = e => {
    const b = e.target.closest('button[data-n]');
    if(!b) return;
    const n = Number(b.dataset.n);
    if(giocata.numeri.has(n)) giocata.numeri.delete(n);
    else if(giocata.numeri.size >= MAX_NUMERI) return;   // dieci e' il massimo giocabile
    else giocata.numeri.add(n);
    document.getElementById('da-previsione').value = '';
    disegnaScelte();
  };

  document.getElementById('ruote').innerHTML =
    Object.entries(RUOTE).map(([s, nome]) =>
      `<button type="button" data-r="${s}" aria-pressed="false">${nome}</button>`).join('') +
    `<button type="button" data-r="TUTTE" aria-pressed="false">Tutte</button>`;
  document.getElementById('ruote').onclick = e => {
    const b = e.target.closest('button[data-r]');
    if(!b) return;
    const r = b.dataset.r;
    if(r === 'TUTTE'){
      const tutte = giocata.ruote.size === 10;
      giocata.ruote = new Set(tutte ? ['NA'] : Object.keys(RUOTE));
    }else if(giocata.ruote.has(r)){
      if(giocata.ruote.size > 1) giocata.ruote.delete(r);   // almeno una deve restare
    }else giocata.ruote.add(r);
    disegnaScelte();
  };

  document.getElementById('sorti').innerHTML = SORTI.map(([nome, k]) =>
    `<button type="button" data-s="${nome}" data-k="${k}" aria-pressed="false">${nome}</button>`).join('');
  document.getElementById('sorti').onclick = e => {
    const b = e.target.closest('button[data-s]');
    if(!b || b.disabled) return;
    const s = b.dataset.s;
    if(giocata.sorti.has(s)){ if(giocata.sorti.size > 1) giocata.sorti.delete(s); }
    else giocata.sorti.add(s);
    disegnaScelte();
  };

  document.getElementById('importo').oninput = e => {
    giocata.importo = Number(e.target.value);
    disegnaScelte();
  };

  document.getElementById('da-previsione').onchange = e => {
    const s = suggerite[Number(e.target.value)];
    if(!s) return;
    giocata.numeri = new Set(s.numeri);
    giocata.ruote = new Set(s.ruote);
    // le sorti compatibili: una terzina si gioca per ambo, non "per terzina"
    giocata.sorti = new Set(SORTI.filter(([, k]) => k <= s.numeri.length && k >= 2)
                                 .map(([n]) => n));
    if(!giocata.sorti.size) giocata.sorti = new Set(['estratto']);
    disegnaScelte();
  };
}

function disegnaScelte(){
  document.querySelectorAll('#griglia button').forEach(b =>
    b.setAttribute('aria-pressed', String(giocata.numeri.has(Number(b.dataset.n)))));
  document.querySelectorAll('#ruote button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.r === 'TUTTE'
      ? giocata.ruote.size === 10 : giocata.ruote.has(b.dataset.r))));

  const quanti = giocata.numeri.size;
  document.querySelectorAll('#sorti button').forEach(b => {
    const k = Number(b.dataset.k);
    b.disabled = k > quanti;
    if(b.disabled) giocata.sorti.delete(b.dataset.s);
    b.setAttribute('aria-pressed', String(giocata.sorti.has(b.dataset.s)));
  });
  if(!giocata.sorti.size && quanti) giocata.sorti.add(quanti === 1 ? 'estratto' : 'ambo');
  document.querySelectorAll('#sorti button').forEach(b =>
    b.setAttribute('aria-pressed', String(giocata.sorti.has(b.dataset.s))));

  document.getElementById('conta-numeri').textContent = quanti
    ? [...giocata.numeri].sort((a,b) => a-b).join(' · ')
    : 'nessuno scelto';
  document.getElementById('nota-sorti').textContent = quanti
    ? `con ${quanti} numer${quanti === 1 ? 'o' : 'i'}`
    : 'scegli prima i numeri';

  clearTimeout(attesaSimula);
  attesaSimula = setTimeout(simula, 250);
}

async function simula(){
  const fuori = document.getElementById('risultato');
  if(!giocata.numeri.size || !giocata.sorti.size || !(giocata.importo > 0)){
    fuori.innerHTML = `<p class="vuoto">Scegli i numeri e l'importo:
      qui comparira' quanto puoi vincere, e con quale probabilita'.</p>`;
    return;
  }
  const corpo = {numeri:[...giocata.numeri], ruote:[...giocata.ruote],
                 sorti:[...giocata.sorti], importo:giocata.importo};
  let r;
  try{
    const risposta = await fetch('/schedina/simula', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(corpo)});
    r = await risposta.json();
    if(!risposta.ok){
      fuori.innerHTML = `<div class="carta"><p class="errore">${r.detail ?? 'giocata non valida'}</p></div>`;
      return;
    }
  }catch(e){
    fuori.innerHTML = `<div class="carta"><p class="errore">Non riesco a calcolare: ${e.message}</p></div>`;
    return;
  }
  mostraSimulazione(r);
}

function mostraSimulazione(r){
  const righe = r.righe.flatMap(s => s.scenari.map((sc, i) => `
    <tr>
      <td>${i === 0 ? `<b>${s.sorte}</b> — ` : ''}escono ${sc.presi} dei tuoi ${r.numeri.length} numeri</td>
      <td data-et="Vincite">${sc.combinazioni_vincenti}</td>
      <td data-et="Incassi" class="${sc.netto >= r.importo ? 'pos' : ''}">${euroS(sc.netto)}</td>
      <td data-et="Probabilita' su una ruota">${unaSu(sc.probabilita)}</td>
    </tr>`)).join('');

  const rip = r.righe.map(s =>
    `${s.sorte}: ${euroS(s.posta_per_ruota)} per ruota su ${s.combinazioni} combinazion${
      s.combinazioni === 1 ? 'e' : 'i'} = ${euroS(s.posta_per_combinazione)} l'una`).join(' · ');

  document.getElementById('risultato').innerHTML = `
    <div class="carta tabella-scroll">
      <p class="ripartizione">${euroS(r.importo)} su ${r.ruote.length} ruot${
        r.ruote.length === 1 ? 'a' : 'e'} (${r.ruote.join(' ')}) — ${rip}</p>
      <table>
        <thead><tr><th>Se esce</th><th>Vincite</th><th>Incassi</th>
          <th>Probabilita' su una ruota</th></tr></thead>
        <tbody>${righe}</tbody>
      </table>
      <div class="verdetto">
        <div>
          <span class="valore">${unaSu(r.qualcosa_almeno_una_ruota)}</span>
          <span class="didascalia">probabilita' di vincere qualcosa, su almeno una
            delle ${r.ruote.length} ruote${perc(r.qualcosa_almeno_una_ruota)}</span>
        </div>
        <div>
          <span class="valore ${r.ritorno_atteso >= r.importo ? 'pos' : 'neg'}">${euroS(r.ritorno_atteso)}</span>
          <span class="didascalia">ritorno atteso su ${euroS(r.importo)} giocati:
            ${(r.ritorno_atteso_per_euro*100).toFixed(0)} centesimi per ogni euro</span>
        </div>
      </div>
    </div>
    <p class="avvertenza">${r.nota}<br><br>
      Il ritorno atteso e' la media matematica, non una previsione su questa giocata:
      in una singola estrazione o si vince o non si vince. Dice che, ripetendo la
      giocata molte volte, tornano indietro circa
      ${(r.ritorno_atteso_per_euro*100).toFixed(0)} centesimi per euro. E' il margine
      del banco, ed e' lo stesso per tutti i metodi: nessuna previsione lo cambia,
      perche' agisce su quali numeri giocare, non su quanto paga il gioco.</p>`;
}

function preparaSuggerimenti(lista){
  suggerite = [];
  for(const p of lista.slice(0, 25)){
    for(const s of p.sorti){
      if(s.numeri.length < 1) continue;
      suggerite.push({numeri:s.numeri, ruote:p.ruote,
        etichetta:`${NOMI[p.metodo] ?? p.metodo} · ${s.tipo} ${s.numeri.join('-')} · ${p.ruote.join(' ')}`});
    }
  }
  document.getElementById('da-previsione').innerHTML =
    `<option value="">parti da una previsione in corso…</option>` +
    suggerite.map((s, i) => `<option value="${i}">${s.etichetta}</option>`).join('');
}

document.querySelectorAll('[data-vista]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-vista]').forEach(x =>
    x.setAttribute('aria-selected', String(x === b)));
  for(const v of ['corso', 'bilancio', 'schedina'])
    document.getElementById(v).hidden = b.dataset.vista !== v;
});

async function carica(){
  try{
    const [stato, corso, bilancio, agg, prossima] = await Promise.all([
      prendi('/salute'), prendi('/previsioni/aperte'), prendi('/statistiche/economia'),
      prendi('/servizio/aggiornamento'), prendi('/prossima-estrazione')]);
    mostraStato(stato);
    mostraInCorso(corso);
    mostraBilancio(bilancio);
    mostraAggiornamento(agg);
    mostraProssima(prossima);
    preparaSuggerimenti(corso);
  }catch(e){
    document.getElementById('stato').textContent =
      'Non riesco a leggere i dati dall\'API: ' + e.message;
  }
}

document.getElementById('aggiorna-ora').onclick = aggiornaOra;
costruisciSchedina();
disegnaScelte();
carica();
</script>
</body>
</html>
